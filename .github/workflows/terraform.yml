name: "Terraform CI/CD pipeline"
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  terraform:
    name: "Terraform Execution"
    runs-on: ubuntu-latest
    steps:
        # 1. Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v3

        # 2. Log in to Azure using stored GitHub Secrets
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

        # 3. Setup Terraform CLI on the GitHub runner
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

        # 4. Check syntax formatting
      - name: Terraform Format Check
        run: terraform fmt -check

        # 5. Initialize Terraform
      - name: Terraform Init
        run: terraform init

        # 6. Select the dev workspace
      - name: Terraform Workspace Select
        run: terraform workspace select dev || terraform workspace new dev

        # 7. Validate the Terraform configuration
      - name: Terraform Validate
        run: terraform validate -no-color

        # 8. Generate execution plan
      - name: Terraform Plan
        run: terraform plan -no-color